[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocp-viewer-smlibpy"
version = "0.1.1"
authors = [{ name = "Bernhard Walter", email = "b_walter@arcor.de" }]
description = "Show smlibpy (SMLib) objects in the OCP CAD Viewer: the smlib kernel plugin for ocp-tessellate"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["3d", "cad", "smlib", "smlibpy", "viewer", "tessellation", "ocp", "nanocct"]
license = "Apache-2.0"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # the plugin interface (ocp_tessellate.plugin) and the kernel tag came with 3.7; capped,
    # since a minor release may still change that young interface
    "ocp-tessellate>=3.7.0,<3.8.0",
    # the viewers' show and show_all take this kernel's objects, and
    # ocp_viewer_core.backend.register_plugin and its entry point group came with 1.2;
    # capped like the viewers, major.minor is the core's contract
    "ocp-viewer-core>=1.2.0,<1.3.0",
    "smlibpy>=0.6.2",
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocp_viewer_smlibpy*"]

[project.optional-dependencies]
dev = ["bump-my-version", "build", "twine", "pytest", "ruff", "ty"]

# keyed by the kernel tag; importing the module registers that half of the plugin. A script
# may import only smlibpy, and every host runs the measurement backend in a process that
# imports no user code and draws nothing
[project.entry-points."ocp_viewer.kernels.show"]
smlib = "ocp_viewer_smlibpy.show"

[project.entry-points."ocp_viewer.kernels.backend"]
smlib = "ocp_viewer_smlibpy.backend"

[project.urls]
"Homepage" = "https://github.com/bernhard-42/ocp-viewer-smlibpy"
"Bug Tracker" = "https://github.com/bernhard-42/ocp-viewer-smlibpy/issues"

# ruff settings

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.isort]
combine-as-imports = true

# bump-my-version settings

[tool.bumpversion]
current_version = "0.1.1"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?P<release>\\d*)(?P<build>\\d*)"
serialize = ["{major}.{minor}.{patch}"]
allow_dirty = true
message = "Bump version: {current_version} → {new_version}"
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
sign_tags = false
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "ocp_viewer_smlibpy/_version.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
